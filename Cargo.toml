[package]
name = "brains-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gltf = {version = "1.4.0", features = ["import"], optional = true}
dodgy = {version = "0.3.0", optional = true}
glam = {version = "0.25.0", optional = true}
candid = "0.10.3"
serde = {version = "1.0", features = ["derive"]}
rmp-serde = "1.1.2"
rand = "=0.8.5"
getrandom = {version = "=0.2.12", features = ["custom"], optional = true}
strum = "0.25"
strum_macros = "0.25"
circular-buffer = "0.1.3"
wasm-bindgen = {version = "0.2.84", optional = true}
navmesh-rs = {version = "0.1.0", path = "../navmesh-rs", optional = true}
neuralarena-cdk = {version = "0.1.0", path = "../neuralarena-cdk"}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
three-rs = {version = "0.1.0", path = "../three-rs", features = ["renderer", "gltf-loader"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
three-rs = {version = "0.1.0", path = "../three-rs", features = []}

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1

[features]
default = ["navigation"]
navigation = ["dep:gltf", "dep:navmesh-rs", "dep:glam", "dep:dodgy"]
js = ["dep:wasm-bindgen", "dep:getrandom"]