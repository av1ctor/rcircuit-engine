[package]
name = "bot-engine-gltf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gltf = {version = "1.4.0", features = ["import"], optional = true}
postcard = {version = "1.0.0", features = ["alloc"]}
three-rs = {version = "0.1.0", path = "../three-rs", optional = true}
navmesh-rs = {version = "0.1.0", path = "../navmesh-rs", optional = true}
serde = {version = "1.0", features = ["derive"]}
rmp-serde = "1.1.2"
rand = "0.8.5"
strum = "0.25"
strum_macros = "0.25"
circular-buffer = "0.1.3"
wasm-bindgen = { version = "0.2.84", optional = true }
getrandom = { version = "0.2", features = ["custom"], optional = true }

[features]
default = ["renderer"]
renderer = ["dep:gltf", "dep:navmesh-rs", "three-rs/renderer", "three-rs/gltf"]
js = ["dep:wasm-bindgen", "dep:getrandom", "dep:three-rs"]